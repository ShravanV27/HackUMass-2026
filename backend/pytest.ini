[pytest]
testpaths = tests
pythonpath = .
addopts = -q
markers =
    live: opt-in live integration tests (external APIs / TigerData); requires --run-live
    destructive: sandbox-mutating Nessie tests; requires --run-destructive + confirmation env
    live_gemini: Gemini network calls within the live suite; also requires LIVE_TEST_GEMINI=1
